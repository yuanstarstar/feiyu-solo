# 放进 /etc/nginx/conf.d/ 或 sites-available/，域名换成你自己的
# 先用 certbot --nginx -d ai.example.com 拿证书，它会自动补 ssl_certificate 两行
server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.example.com;

    # certbot 会填这两行
    # ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    client_max_body_size 80k;   # 站点请求体上限 64KB，留点余量
    access_log /var/log/nginx/feiyu-solo.access.log;
    error_log  /var/log/nginx/feiyu-solo.error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # 关键：用 $remote_addr 而不是 $proxy_add_x_forwarded_for，
        # 否则客户端自带的 XFF 会被追加进来，服务端信任它就能伪造来源绕过封禁
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # 这些路径压根不该出现在公网
    location ~* ^/(data|lib|vendor|_test|deploy|\.env|server\.mjs|setup\.mjs|package\.json) {
        return 404;
    }
}
